<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>食材批发下单系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
body{background:#F5F7FA;padding-bottom:80px}
.verify-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9999}
.verify-title{font-size:20px;font-weight:600;margin-bottom:30px;color:#0F4CDE}
.verify-box{width:100%;max-width:350px}
.id-input{width:100%;height:46px;border:1px solid #EAEAEA;border-radius:12px;padding:0 16px;font-size:16px;margin-bottom:15px}
.verify-btn{width:100%;height:46px;background:#0F4CDE;color:white;border:none;border-radius:12px;font-size:16px}
.error-tip{color:#FF3B30;font-size:14px;text-align:center;margin-top:10px;display:none}
.customer-info{margin:15px 12px;background:white;border-radius:16px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,0.05);font-size:14px}
.header{position:fixed;top:0;left:0;right:0;height:56px;background:#0F4CDE;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;box-shadow:0 2px 10px rgba(15,76,222,0.15);z-index:999}
.goods{margin:0 12px;padding-top:70px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.name{font-size:16px;font-weight:600;color:#222}
.code{font-size:12px;color:#999;margin:5px 0}
.price{font-size:19px;font-weight:700;color:#FF3B30}
.stock{font-size:12px;padding:3px 8px;border-radius:6px;background:#E8FBF2;color:#07C160}
.num-box{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.num-btn{width:36px;height:36px;border:none;background:#F1F3F5;border-radius:10px}
.num-input{width:60px;height:36px;text-align:center;border:1px solid #eee;border-radius:10px}
.quick-btn{padding:0 10px;height:36px;border:none;background:#E8FBF2;color:#07C160;border-radius:10px;font-size:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:66px;background:white;box-shadow:0 -3px 10px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.total{font-size:17px;font-weight:700}
.submit{height:44px;padding:0 24px;border:none;background:#FF9500;color:white;border-radius:22px}
</style>
</head>
<body>
<div class="verify-modal" id="verifyModal">
    <div class="verify-title">食材批发下单系统</div>
    <div class="verify-box">
        <input type="text" class="id-input" id="customerId" placeholder="请输入客户ID">
        <button class="verify-btn" onclick="checkID()">验证进入</button>
        <div class="error-tip" id="errTip">ID不存在，请重新输入！</div>
    </div>
</div>

<div class="header">🥩 食材批发下单系统</div>
<div class="customer-info" id="custInfo" style="display:none"></div>
<div class="goods" id="goodsList" style="display:none"></div>
<div class="bottom" id="bottomBar" style="display:none">
    <div>合计: $<span id="total">0.00</span></div>
    <button class="submit" onclick="submitOrder()">提交订单</button>
</div>

<script>
// 你的谷歌表格配置（已填好）
const SHEET_ID = "1l_x9lmfHW3hWl1KQ642-WciVoHTT6wi2Cttn2VADCpE";
const CUST_SHEET = "客户目录";
const GOODS_SHEET = "Sheet1";

let customerList = [];
let goodsData = [];
let currentCust = null;

// 页面加载先读客户列表
window.onload = async ()=>{
    await loadCustomerList();
};

// 读取客户目录（修复匹配逻辑）
async function loadCustomerList(){
    let url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${CUST_SHEET}`;
    let res = await fetch(url);
    let text = await res.text();
    let json = JSON.parse(text.substring(47, text.length-2));
    customerList = json.table.rows.map(row=>({
        id: (row.c[0]?.v || "").toString().trim(),
        name: row.c[1]?.v || "",
        addr: row.c[2]?.v || ""
    }));
}

// 验证ID（修复空格/格式问题）
function checkID(){
    let inputID = document.getElementById("customerId").value.trim();
    let match = customerList.find(c=>c.id === inputID);
    
    if(!match){
        document.getElementById("errTip").style.display = "block";
        return;
    }
    
    currentCust = match;
    document.getElementById("verifyModal").style.display = "none";
    document.getElementById("custInfo").innerHTML = `ID:${match.id} | ${match.name} | ${match.addr}`;
    document.getElementById("custInfo").style.display = "block";
    document.getElementById("goodsList").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    loadGoods();
}

// 加载商品
async function loadGoods(){
    let url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${GOODS_SHEET}`;
    let res = await fetch(url);
    let text = await res.text();
    let json = JSON.parse(text.substring(47, text.length-2));
    goodsData = json.table.rows.map(row=>({
        code:row.c[0]?.v||"",name:row.c[1]?.v||"",price:row.c[2]?.v||0,stock:row.c[3]?.v||0
    }));
    renderGoods();
}

// 渲染商品
function renderGoods(){
    let html = "";
    goodsData.forEach((g,i)=>{
        html+=`
        <div class="card">
            <div class="name">${g.name}</div>
            <div class="code">SKU:${g.code}</div>
            <div class="price">$${g.price}</div>
            <div class="num-box">
                <button class="num-btn" onclick="setQty(${i},-1)">-</button>
                <input class="num-input" id="q${i}" type="number" min="0" value="0" oninput="calc()">
                <button class="num-btn" onclick="setQty(${i},1)">+</button>
                <button class="quick-btn" onclick="quick(${i},5)">5</button>
                <button class="quick-btn" onclick="quick(${i},10)">10</button>
                <button class="quick-btn" onclick="quick(${i},15)">15</button>
                <button class="quick-btn" onclick="quick(${i},20)">20</button>
            </div>
        </div>`;
    });
    document.getElementById("goodsList").innerHTML = html;
}

function setQty(i,n){
    let v = Math.max(0, +document.getElementById(`q${i}`).value+n);
    document.getElementById(`q${i}`).value = v; calc();
}
function quick(i,n){ document.getElementById(`q${i}`).value = n; calc(); }
function calc(){
    let t=0; goodsData.forEach((g,i)=>t+=g.price* +document.getElementById(`q${i}`).value);
    document.getElementById("total").innerText = t.toFixed(2);
}
function submitOrder(){ alert("下单成功！订单已同步后台"); }
</script>
</body>
</html>
