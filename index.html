<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>食材批發下單系統</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
body{background:#F5F7FA;padding-bottom:80px}
.verify-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9999}
.verify-title{font-size:20px;font-weight:600;margin-bottom:30px;color:#5e88c6}
.verify-box{width:100%;max-width:350px}
.id-input{width:100%;height:46px;border:1px solid #EAEAEA;border-radius:12px;padding:0 16px;font-size:16px;margin-bottom:15px}
.verify-btn{width:100%;height:46px;background:#5e88c6;color:white;border:none;border-radius:12px;font-size:16px}
.error-tip{color:#FF3B30;font-size:14px;text-align:center;margin-top:10px;display:none}
.customer-info{margin:15px 12px;background:white;border-radius:16px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,0.05);font-size:14px}

/* 表頭顏色已改為 #5e88c6 */
.header{position:fixed;top:0;left:0;right:0;height:56px;background:#5e88c6;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;box-shadow:0 2px 10px rgba(94,136,198,0.15);z-index:999}

/* 搜索+分類欄 */
.toolbar{position:fixed;top:56px;left:0;right:0;background:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);z-index:998}
.search-box{width:100%;height:38px;border:1px solid #EAEAEA;border-radius:10px;padding:0 12px;font-size:14px;margin-bottom:10px}
.category-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.category-btn{flex-shrink:0;padding:6px 14px;border:none;border-radius:20px;background:#F1F3F5;font-size:13px;color:#666}
.category-btn.active{background:#5e88c6;color:white}

.goods{margin:0 12px;padding-top:130px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(0,0,0,0.05)}
.name{font-size:16px;font-weight:600;color:#222}
.code{font-size:12px;color:#999;margin:5px 0}
.price{font-size:19px;font-weight:700;color:#FF3B30}
.price-na{color:#999;font-size:16px}
.stock{font-size:12px;padding:3px 8px;border-radius:6px;background:#E8FBF2;color:#07C160;margin-left:10px}
.stock-out{background:#FFC7CE;color:#D80000}
.num-box{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.num-btn{width:36px;height:36px;border:none;background:#F1F3F5;border-radius:10px}
.num-input{width:60px;height:36px;text-align:center;border:1px solid #eee;border-radius:10px}
.num-input:disabled{background:#f5f5f5;color:#ccc}
.quick-btn{padding:0 10px;height:36px;border:none;background:#E8FBF2;color:#07C160;border-radius:10px;font-size:12px}
.quick-btn:disabled{background:#eee;color:#ccc}
.bottom{position:fixed;left:0;right:0;bottom:0;height:66px;background:white;box-shadow:0 -3px 10px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.total{font-size:17px;font-weight:700}
.submit{height:44px;padding:0 24px;border:none;background:#FF9500;color:white;border-radius:22px}
.loading{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>
<!-- ID驗證彈窗 -->
<div class="verify-modal" id="verifyModal">
    <div class="verify-title">食材批發下單系統</div>
    <div class="verify-box">
        <input type="text" class="id-input" id="customerId" placeholder="請輸入客戶ID">
        <button class="verify-btn" onclick="checkCustomer()">驗證並進入</button>
        <div class="error-tip" id="errTip">ID不存在，請重新輸入！</div>
    </div>
</div>

<div class="header">🥩 食材批發下單系統</div>

<!-- 搜索+分類工具欄 -->
<div class="toolbar" id="toolbar" style="display:none">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 搜尋商品名稱..." oninput="filterGoods()">
    <div class="category-wrap" id="categoryBar">
        <button class="category-btn active" onclick="setCategory('all')">全部</button>
        <button class="category-btn" onclick="setCategory('100')">家禽</button>
        <button class="category-btn" onclick="setCategory('200')">牛</button>
        <button class="category-btn" onclick="setCategory('300')">豬</button>
        <button class="category-btn" onclick="setCategory('400')">蝦</button>
        <button class="category-btn" onclick="setCategory('500')">海鮮</button>
        <button class="category-btn" onclick="setCategory('600')">雜類</button>
        <button class="category-btn" onclick="setCategory('700')">蔬果</button>
        <button class="category-btn" onclick="setCategory('800')">乾貨</button>
        <button class="category-btn" onclick="setCategory('other')">其他</button>
    </div>
</div>

<div class="customer-info" id="custInfo" style="display:none"></div>
<div class="goods" id="goodsList" style="display:none">
    <div class="loading">正在載入商品資料...</div>
</div>
<div class="bottom" id="bottomBar" style="display:none">
    <div>合計: $<span id="total">0.00</span></div>
    <button class="submit" onclick="submitOrder()">提交訂單</button>
</div>

<script>
// ========== 配置區 ==========
const SHEET_ID = "1l_x9lmfHW3hWl1KQ642-WciVoHTT6wi2Cttn2VADCpE";
const GOODS_SHEET = "商品總表";
const ORDER_SHEET = "訂單記錄";

// 谷歌表格列對應索引 (A=0, B=1, C=2, D=3, E=4, F=5)
const COL = {
    CUST_ID: 0,   // A列：客戶ID
    SKU: 1,       // B列：SKU編碼
    NAME: 2,      // C列：商品名稱
    UNIT: 3,      // D列：單位
    PRICE: 4,     // E列：售價
    STOCK: 5      // F列：庫存數量
};

let currentCustId = "";
let allGoods = [];       // 全部商品
let showGoods = [];      // 篩選後顯示的商品
let currentCategory = "all";
let orderItems = [];

// ========== 驗證客戶ID ==========
function checkCustomer(){
    const inputId = document.getElementById("customerId").value.trim();
    if(!inputId){
        document.getElementById("errTip").style.display = "block";
        return;
    }
    
    currentCustId = inputId;
    document.getElementById("verifyModal").style.display = "none";
    document.getElementById("toolbar").style.display = "block";
    document.getElementById("custInfo").style.display = "block";
    document.getElementById("custInfo").innerText = "客戶ID：" + inputId;
    document.getElementById("goodsList").style.display = "block";
    document.getElementById("bottomBar").style.display = "flex";
    
    loadGoodsByCustomer(inputId);
}

// ========== 按客戶ID載入商品 ==========
async function loadGoodsByCustomer(custId){
    try{
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${GOODS_SHEET}`;
        const res = await fetch(url);
        const text = await res.text();
        const json = JSON.parse(text.substring(47, text.length-2));
        
        const rows = json.table.rows;
        allGoods = [];
        
        for(let i=0; i<rows.length; i++){
            const row = rows[i].c;
            if(!row[COL.CUST_ID]) continue;
            
            const id = row[COL.CUST_ID].v + "";
            if(id === custId){
                // 修復SKU顯示：強制轉字串，支援數字+字母格式
                const skuVal = row[COL.SKU] ? (row[COL.SKU].v ?? row[COL.SKU].f ?? "") : "";
                allGoods.push({
                    sku: String(skuVal),
                    name: row[COL.NAME] ? row[COL.NAME].v + "" : "",
                    unit: row[COL.UNIT] ? row[COL.UNIT].v + "" : "",
                    price: row[COL.PRICE] ? parseFloat(row[COL.PRICE].v) || 0 : 0,
                    stock: row[COL.STOCK] ? parseFloat(row[COL.STOCK].v) || 0 : 0
                });
            }
        }
        
        if(allGoods.length === 0){
            document.getElementById("goodsList").innerHTML = `<div class="loading">查無此客戶的商品資料</div>`;
            return;
        }
        
        filterGoods();
    }catch(e){
        document.getElementById("goodsList").innerHTML = `<div class="loading">商品載入失敗，請稍後再試</div>`;
        console.error(e);
    }
}

// ========== 分類切換 ==========
function setCategory(cat){
    currentCategory = cat;
    // 更新按鈕狀態
    document.querySelectorAll(".category-btn").forEach(btn=>{
        btn.classList.remove("active");
    });
    event.target.classList.add("active");
    filterGoods();
}

// ========== 搜索+分類篩選 ==========
function filterGoods(){
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    
    showGoods = allGoods.filter(g=>{
        // 分類篩選
        let matchCat = false;
        const skuHead = g.sku.substring(0,3);
        
        if(currentCategory === "all"){
            matchCat = true;
        }else if(currentCategory === "other"){
            matchCat = !["100","200","300","400","500","600","700","800"].includes(skuHead);
        }else{
            matchCat = skuHead === currentCategory;
        }
        
        // 搜索篩選
        let matchSearch = true;
        if(keyword){
            matchSearch = g.name.toLowerCase().includes(keyword) || g.sku.toLowerCase().includes(keyword);
        }
        
        return matchCat && matchSearch;
    });
    
    renderGoods();
    calcTotal();
}

// ========== 渲染商品列表 ==========
function renderGoods(){
    if(showGoods.length === 0){
        document.getElementById("goodsList").innerHTML = `<div class="loading">沒有符合條件的商品</div>`;
        return;
    }
    
    let html = "";
    showGoods.forEach((g, index)=>{
        const isOut = g.stock <= 0;
        const priceText = isOut ? "N/A" : "$" + g.price.toFixed(2);
        const priceClass = isOut ? "price-na" : "";
        const stockClass = isOut ? "stock-out" : "";
        const stockText = isOut ? "缺貨" : "庫存充足";
        const disabled = isOut ? "disabled" : "";
        
        html += `
        <div class="card">
            <div class="name">${g.name}</div>
            <div class="code">SKU：${g.sku} | 單位：${g.unit}</div>
            <div style="display:flex;align-items:center">
                <span class="price ${priceClass}">${priceText}</span>
                <span class="stock ${stockClass}">${stockText}</span>
            </div>
            <div class="num-box">
                <button class="num-btn" onclick="changeQty(${index}, -1)" ${disabled}>-</button>
                <input class="num-input" id="qty_${index}" type="number" min="0" value="0" ${disabled} oninput="calcTotal()">
                <button class="num-btn" onclick="changeQty(${index}, 1)" ${disabled}>+</button>
                <button class="quick-btn" onclick="setQty(${index}, 5)" ${disabled}>5</button>
                <button class="quick-btn" onclick="setQty(${index}, 10)" ${disabled}>10</button>
                <button class="quick-btn" onclick="setQty(${index}, 15)" ${disabled}>15</button>
                <button class="quick-btn" onclick="setQty(${index}, 20)" ${disabled}>20</button>
            </div>
        </div>`;
    });
    
    document.getElementById("goodsList").innerHTML = html;
}

function changeQty(index, delta){
    const input = document.getElementById("qty_" + index);
    input.value = Math.max(0, parseFloat(input.value) + delta);
    calcTotal();
}

function setQty(index, num){
    document.getElementById("qty_" + index).value = num;
    calcTotal();
}

// ========== 計算總價 ==========
function calcTotal(){
    let total = 0;
    orderItems = [];
    
    showGoods.forEach((g, index)=>{
        const qty = parseFloat(document.getElementById("qty_" + index).value) || 0;
        if(qty > 0 && g.stock > 0){
            total += g.price * qty;
            orderItems.push({
                sku: g.sku,
                name: g.name,  // 保留商品名稱
                qty: qty,
                price: g.price
            });
        }
    });
    
    document.getElementById("total").innerText = total.toFixed(2);
}

// ========== 提交訂單 ==========
async function submitOrder(){
    if(orderItems.length === 0){
        alert("請先選擇商品數量！");
        return;
    }
    
    if(!confirm("確認提交訂單？")) return;
    
    try{
        const now = new Date();
        const timeStr = now.getFullYear() + "/" + (now.getMonth()+1) + "/" + now.getDate() + " " + now.getHours() + ":" + now.getMinutes();
        
        // 訂單格式：A=SKU, B=數量, C=空, D=空, E=商品名稱, F=單價, G=客戶ID, H=時間
        let rows = [];
        orderItems.forEach(item=>{
            rows.push([
                item.sku,
                item.qty,
                "", "",           // C/D 兩個空白欄
                item.name,        // E列：商品名稱
                item.price.toFixed(2),
                currentCustId,
                timeStr
            ]);
        });
        
        await appendToSheet(ORDER_SHEET, rows);
        alert("✅ 下單成功！訂單已同步後台");
        
        // 清空數量
        document.getElementById("searchInput").value = "";
        currentCategory = "all";
        document.querySelectorAll(".category-btn").forEach(btn=>{
            btn.classList.remove("active");
        });
        document.querySelector(".category-btn").classList.add("active");
        filterGoods();
        
    }catch(e){
        alert("❌ 提交失敗，請稍後再試");
        console.error(e);
    }
}

// ========== 寫入谷歌表格 ==========
function appendToSheet(sheetName, rows){
    return new Promise(function(resolve, reject){
        const GAS_URL = "https://script.google.com/macros/s/AKfycbydsOL0ccBoUFoP2SxVTJmImSms87WpKVOPX-PdzXoK9bDLfh5LLmwKMqNTk4zv6f25/exec";
        
        const body = {
            action: "append",
            sheetName: sheetName,
            data: rows
        };
        
        const xhr = new XMLHttpRequest();
        xhr.open("POST", GAS_URL, true);
        xhr.setRequestHeader("Content-Type", "text/plain");
        
        xhr.onload = function(){
            try{
                const result = JSON.parse(xhr.responseText);
                if(result.status === "success"){
                    resolve(result);
                }else{
                    reject(new Error(result.message));
                }
            }catch(e){
                reject(new Error("回應格式錯誤"));
            }
        };
        
        xhr.onerror = function(){
            reject(new Error("網絡連線失敗"));
        };
        
        xhr.send(JSON.stringify(body));
    });
}
</script>
</body>
</html>
